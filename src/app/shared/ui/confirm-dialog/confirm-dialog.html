<div class="fixed inset-0 z-100 flex items-center justify-center bg-black/40"
     (click)="cancel.emit()"
     (keydown.escape)="cancel.emit()">

  <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"
       class="w-85 rounded-xl bg-[#FAEEDD] p-6 shadow-xl"
       (click)="$event.stopPropagation()">

    <h2 id="confirm-title" class="text-lg font-semibold text-stone-800">
      {{ title() }}
    </h2>

    @if (message()) {
      <p class="mt-2 text-sm text-stone-600">{{ message() }}</p>
    }

    <ng-content />

    <div class="mt-5 flex justify-end gap-2">
      <button type="button" (click)="cancel.emit()" class="px-3 py-1">
        {{ cancelLabel() }}
      </button>

      <button type="button" (click)="confirm.emit()"
              [class]="danger()
                ? 'rounded bg-red-800 px-3 py-1 text-white'
                : 'rounded bg-[#E7B770] px-3 py-1'">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
