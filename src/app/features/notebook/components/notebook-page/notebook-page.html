<article
  class="relative flex min-h-200 w-full min-w-0 flex-col
         bg-[#FFFEFA] px-8 py-10
         shadow-[0_2px_8px_rgba(0,0,0,0.08)]"
>

  <!-- tittle -->
  <header class="mb-6 border-b border-stone-200 pb-3">
    <h2 class="text-xl font-semibold text-stone-800">
      {{ title() }}
    </h2>
  </header>


  <!-- write/edit area -->
  <div
    #canvas
    class="page-canvas cursor-text"
    (click)="createTextBoxAt($event)"
  >

    @for (box of textBoxes(); track box.id) {

      <div
        class="absolute z-10"
        [style.left.px]="box.x"
        [style.top.px]="box.y"
        [style.width.px]="box.width"
        [style.height.px]="getDisplayedHeight(box)"
        (click)="selectTextBox(box.id, $event)"
      >

        <!-- text editor -->
        <app-text-box
          [box]="box"
          [autoFocus]="box.id === activeTextBoxId()"
          [selected]="box.id === activeTextBoxId()"
          (contentChange)="updateTextBoxContent(box.id, $event)"
          (contentHeightChange)="updateContentHeight(box.id, $event)"
          (emptyOnBlur)="removeEmptyTextBox(box.id)"
        />


        @if (activeTextBoxId() === box.id) {

          <!-- move control -->
          <button
            type="button"
            class="move-handle"
            aria-label="Mover caixa de texto"
            (pointerdown)="startMove($event, box)"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          >
            ⠿
          </button>


          <!-- top border -->
          <button
            type="button"
            class="resize-hit-area resize-top"
            aria-label="Redimensionar pela borda superior"
            (pointerdown)="startResize($event, box, 'top')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- button border -->
          <button
            type="button"
            class="resize-hit-area resize-bottom"
            aria-label="Redimensionar pela borda inferior"
            (pointerdown)="startResize($event, box, 'bottom')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- left border -->
          <button
            type="button"
            class="resize-hit-area resize-left"
            aria-label="Redimensionar pela borda esquerda"
            (pointerdown)="startResize($event, box, 'left')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- right border -->
          <button
            type="button"
            class="resize-hit-area resize-right"
            aria-label="Redimensionar pela borda direita"
            (pointerdown)="startResize($event, box, 'right')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- left top corner -->
          <button
            type="button"
            class="resize-hit-area resize-corner resize-top-left"
            aria-label="Redimensionar pelo canto superior esquerdo"
            (pointerdown)="startResize($event, box, 'top-left')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- right top corner -->
          <button
            type="button"
            class="resize-hit-area resize-corner resize-top-right"
            aria-label="Redimensionar pelo canto superior direito"
            (pointerdown)="startResize($event, box, 'top-right')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- left button corner -->
          <button
            type="button"
            class="resize-hit-area resize-corner resize-bottom-left"
            aria-label="Redimensionar pelo canto inferior esquerdo"
            (pointerdown)="startResize($event, box, 'bottom-left')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>


          <!-- right button corner -->
          <button
            type="button"
            class="resize-hit-area resize-corner resize-bottom-right"
            aria-label="Redimensionar pelo canto inferior direito"
            (pointerdown)="startResize($event, box, 'bottom-right')"
            (pointermove)="handlePointerMove($event)"
            (pointerup)="endPointerAction($event)"
            (pointercancel)="endPointerAction($event)"
            (click)="$event.stopPropagation()"
          ></button>

        }

      </div>

    }

  </div>


  <!-- page num -->
  <footer class="mt-6 flex justify-center">
    <span class="text-xs text-stone-400">
      {{ pageNumber() }}
    </span>
  </footer>

</article>
