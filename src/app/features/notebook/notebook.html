<main class="relative isolate min-h-screen  
  overflow-hidden [px-4 py-3 md:px-8 ]
   bg-[linear-gradient(180deg,var(--color-oak-100)_0%,var(--color-oak-200)_100%)]">

   <div class="flex w-full justify-center pb-2">
      <app-search-bar/>
   </div>

  <app-notebook-cover class="block w-full">
    <div
      class="mx-auto grid w-full 
             grid-cols-1 min-[900px]:gap-0 gap-2
             min-[900px]:grid-cols-2"
    >
      <app-notebook-page
        title="My first page"
        [pageNumber]="1"
      />

      <app-notebook-page
        title="My second page"
        [pageNumber]="2"
      />
      <div
        class="pointer-events-none absolute
              left-1/2 top-0 bottom-0 z-10
              hidden min-[900px]:block
              w-px -translate-x-1/2
              bg-[#CFB994]"
      ></div>
    </div>

  </app-notebook-cover>

</main>
