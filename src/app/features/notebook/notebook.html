<main class="relative isolate min-h-screen w-full
  overflow-hidden [px-4 py-3 md:px-8 
   bg-[linear-gradient(180deg,var(--color-oak-100)_0%,var(--color-oak-200)_100%)]">

<div class="relative flex mx-auto w-full items-center justify-between pb-2">

  <app-round-icon-button
    iconSrc="assets/white-shelf-icon.svg"
    ariaLabel="Voltar à estante"
    (clicked)="backPage()"
  />

  <div class="absolute flex left-1/2 -translate-x-1/2 items-center justify-center gap-3">
    <app-round-icon-button
      iconSrc="assets/white-arrow-back-icon.svg"
      ariaLabel="Página anterior"
      [disabled]="currentPagePosition() === 1 "
      (clicked)="previousPage()"
    />

    <!-- Pesquisa -->
    <app-search-bar/>

    <!-- Próxima página -->
    <app-round-icon-button
      iconSrc="assets/white-arrow-forward-icon.svg"
      ariaLabel="Próxima página"
      (clicked)="nextPage()"
    />
  </div>

</div>

    <app-notebook-cover class="block w-full">
      <div
      class="relative mx-auto grid w-full min-w-0
            grid-cols-1 gap-2
            min-[1000px]:grid-cols-2
            min-[1000px]:gap-0"
      >

      @for (page of visiblePages(); track page.id) {
        <app-notebook-page
          [pageId]="page.id"
          [title]="page.title"
          [pageNumber]="page.position"
          [initialTextBoxes]="getTextBoxesForPage(page.id)"
          (textBoxesChange)="updateTextBoxes(page.id, $event)"
        />
      }
      <div
        class="pointer-events-none absolute
                left-1/2 top-0 bottom-0 z-10
                hidden min-[1000px]:block
                w-px -translate-x-1/2
                bg-[#CFB994]"
      ></div>
      </div>

    </app-notebook-cover>

</main>
