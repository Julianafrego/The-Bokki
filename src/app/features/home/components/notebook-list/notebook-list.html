<section class="m-10">
  @if (store.error()) {
    <p class="mt-4 text-red-700">{{ store.error() }}</p>
  }

  <div id="bokkis" class="mt-8 flex flex-col gap-y-2">
    <div class="relative">
      <div class="flex h-53.75 items-end gap-x-3">

        <!-- Criar novo Bokki -->
        <div class="flex h-53.75 w-20 shrink-0 items-end">
          <button type="button" (click)="openCreate()" aria-label="New Bokki"
                  class="mb-3 flex h-47.5 w-full items-center justify-center
                         rounded-[7px] border-2 border-dashed border-[#C99D5B]
                         bg-[#FAEEDD] hover:bg-[#E7B770]">
            <span class="text-5xl text-[#17124d]">+</span>
          </button>
        </div>

        @for (n of store.notebooks(); track n.id) {
          <app-notebook class="shrink-0" [notebook]="n"
                        (edit)="openEdit($event)"
                        (remove)="deleting.set($event)" />
        }
      </div>
    </div>
  </div>
</section>

@if (formOpen()) {
  <app-notebook-form
    [notebook]="editing()"
    (save)="save($event)"
    (cancel)="formOpen.set(false)" />
}

@if (deleting(); as n) {
  <app-confirm-dialog
    title="Delete this Bokki?"
    message="This action cannot be undone."
    confirmLabel="Delete"
    [danger]="true"
    (confirm)="confirmDelete()"
    (cancel)="deleting.set(null)">

    <p class="mt-2 text-sm font-bold text-gray-500">{{ n.title }}</p>
  </app-confirm-dialog>
}
