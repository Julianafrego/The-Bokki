<div class="fixed inset-0 z-100 flex items-center justify-center bg-black/40"
     (click)="cancel.emit()">

  <div role="dialog" aria-modal="true"
       class="w-90 rounded-xl bg-wall-top p-6 shadow-xl"
       (click)="$event.stopPropagation()">

    <h2 class="mb-4 text-lg font-semibold text-stone-800">
      {{ notebook() ? 'Edit Bokki' : 'New Bokki' }}
    </h2>

    <div class="relative">
      <input 
        id="title" type="text"
        [ngModel]="title()" (ngModelChange)="title.set($event)"
        (keydown.enter)="submit()" placeholder=""
        class="peer w-full rounded-lg border border-oak-100 bg-transparent
          px-3 pb-2 pt-4 text-sm
          text-stone-800 outline-none transition
          focus:border-oak-400"
      />
      <label for="title"
        class="pointer-events-none absolute left-3 top-2
          origin-left -translate-y-1/2  bg-wall-top
           px-1 text-sm text-oak-300 transition-all
           peer-placeholder-shown:top-1/2
           peer-placeholder-shown:text-sm
           peer-focus:top-0 peer-focus:text-xs
           peer-focus:text-oak-400">
        Title
      </label>
    </div>


    <div class="relative mt-4">
      <textarea
        id="description"
        rows="3"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        placeholder=" "
        class="peer w-full resize-none rounded-lg border
              border-oak-100 bg-transparent px-3 pb-2 pt-5
              text-sm text-stone-800 outline-none transition
              focus:border-oak-400"
      ></textarea>

      <label
        for="description"
        class="pointer-events-none absolute left-3 top-2
              -translate-y-1/2
              bg-wall-top px-1 text-sm text-oak-300
              transition-all
              peer-placeholder-shown:top-4
              peer-focus:top-0 peer-focus:text-xs
              peer-focus:text-oak-400"
      >
        Description
      </label>
    </div>

    <label class="mt-3 flex items-center gap-2 text-sm text-stone-700">Color
      <input type="color" [ngModel]="color()" (ngModelChange)="color.set($event)" />
    </label>

    <app-shelf [compact]="true">
      <app-notebook 
        [notebook]="previewNotebook()"
        [previewOnly]="true"
        [compact]="true"
      >    
      </app-notebook>
    </app-shelf>

    <div class="mt-5 flex justify-end gap-2">
      <button type="button" (click)="cancel.emit()" class="px-3 py-1">Cancel</button>
      <button type="button" (click)="submit()" [disabled]="!title().trim()"
              class="rounded bg-[#E7B770] px-3 py-1 disabled:opacity-50">Save</button>
    </div>
  </div>
</div>
