<article class="group relative h-53.75 w-20"
[class.h-[120px]]="compact()" [class.]>
    
    <!-- lombada -->
    <div class="flex h-53.75 items-end"
        [class.h-[120px]]="compact()">
        <button
            type="button"
            [style.background-color]="notebook().color"
            class="relative isolate h-45.5 w-17.5 flex flex-col items-center
                rounded-[3px] pt-4.5 pb-2.5
                shadow-[3px_1px_6px_rgba(62,34,14,0.28),inset_0_1px_0_rgba(255,255,255,0.15)]
                bg-[linear-gradient(90deg,rgba(43,23,10,0.22)_0%,rgba(255,255,255,0.14)_30%,rgba(255,255,255,0.04)_55%,rgba(43,23,10,0.25)_100%)]
                transition-transform duration-200 hover:-translate-y-2
                focus-visible:-translate-y-2 focus-visible:outline-2 focus-visible:outline-offset-2"
                [class.h-[100px]]="compact()"
                [class.w-[38px]]="compact()"
                [class.pt-2]="compact()"
                [class.pb-1]="compact()"
  >     

            <!--traço decorativo superior
            <span aria-hidden="true"
                class="pointer-events-none h-0.3 w-8 shrink-0 rounded-full bg-white/40"></span>
            -->
                
            <!-- tittle -->
            <span class="pointer-events-none absolute inset-0 flex items-center 
                    justify-center px-4 text-sm font-semibold text-stone-800
                    [writing-mode:vertical-rl] line-clamp-1
                    whitespace-normal wrap-anywhere"
                    [class.text-[6px]]="compact()"
                    [class.px-1]="compact()">
                        {{ notebook().title }}
            </span>
        </button>
    </div>   

    
    @if (!previewOnly()) {
             <div class="flex invisible absolute w-50 left-full p-3 opacity-0 
                top-[calc(50%-12px)] -translate-y-1/2 z-50 
                rounded-xl bg-[#FAEEDD] shadow-xl transition-all duration-200 
                group-hover:visible group-hover:opacity-100 
                group-focus-within:visible group-focus-within:opacity-100">

            <div class="flex min-w-0 flex-1 flex-col">
                <h2 class="text-lg font-semibold text-stone-800 min-w-0 wrap-break-word"> 
                    {{ notebook().title }}
                </h2>

                <p class="text-sm text-stone-500 min-w-0 wrap-break-word">
                    {{ notebook().description || 'without description.' }}
                </p>

                <div class="mt-2 flex gap-2">
                    <app-button
                        label="Open notes"
                        [variant]="'primary'"
                        (clicked)="edit.emit(notebook())"
                        [fullWidth]="true"
                        [Fullheight]="true"
                        size="md"
                        
                    >
                        <img
                            button-icon
                            src="/assets/open-book-icon.svg"
                            alt=""
                        />
                    </app-button>

                    <app-button
                        label="Edit"
                        [variant]="'secondary'"
                        (clicked)="edit.emit(notebook())"
                        size="sm"
                        [fullWidth]="true"
                        [Fullheight]="true"
                        iconPosition="top"
                    >
                        <img
                            button-icon
                            src="/assets/edit-icon.svg"
                            alt=""
                            class="h-2 w-2"
                        />
                    </app-button>
                </div>

            </div>
        </div>
    }
</article>
